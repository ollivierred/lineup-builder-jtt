                      <div class="min-w-0"><span class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(p.name)}</span><span class="ml-1.5 px-1.5 py-0.5 rounded bg-slate-100 text-[10px] font-bold text-slate-600">${p.gender}</span></div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        ${pendingDeletePlayerId === p.id
                          ? `<button type="button" onclick="cancelDeleteRosterPlayer()" class="px-2.5 py-1 rounded-full bg-slate-100 text-[11px] font-semibold text-slate-700">Cancel</button><button type="button" onclick="confirmDeleteRosterPlayer('${p.id}')" class="px-2.5 py-1 rounded-full bg-rose-600 text-white text-[11px] font-bold">Confirm</button>`
                          : `<button type="button" aria-label="Remove ${escapeHtml(p.name)}" onclick="promptDeleteRosterPlayer('${p.id}')" class="px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-[11px] font-semibold text-rose-600">Remove</button>`
                        }
                      </div>
                    </div>
                  `).join('')}
                </div>

                <div class="rounded-2xl border border-slate-200/90 bg-slate-50/80 p-3 flex items-center justify-between gap-3 shrink-0">
                  <div class="min-w-0"><div class="text-xs font-extrabold text-navy-900">Import Roster (.csv)</div><div class="text-[11px] text-slate-500 truncate">Upload CSV with Name, M or F per row</div></div>
                  <label tabindex="0" role="button" aria-label="Upload CSV roster file" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('input').click();}" class="px-3.5 py-2 rounded-full bg-navy-900 text-lime-400 text-xs font-extrabold shadow-sm cursor-pointer shrink-0 hover:opacity-95 transition inline-flex items-center gap-1.5">
                    ${getVectorArrowHtml('up', 'w-3 h-3')}<span>Upload CSV</span>
                    <input type="file" accept=".csv,text/csv" onchange="handleCsvRosterUpload(event)" class="hidden" />
                  </label>
                </div>
              </div>
            ` : ''}

            ${settingsTab === 'templates' ? `
              <div class="flex-1 min-h-0 flex flex-col space-y-3">
                <div role="tablist" aria-label="Template types" class="grid grid-cols-3 p-1 rounded-xl bg-slate-100 border border-slate-200/80 shrink-0">
                  ${[['availability', '1. Availability'], ['followup', '2. Follow-Up'], ['lineup', '3. Lineup']].map(([id, lbl]) => `
                    <button type="button" role="tab" aria-selected="${settingsTemplateTab === id}" onclick="setSettingsTemplateTab('${id}')" class="py-1.5 px-1 rounded-lg text-[11px] transition truncate ${settingsTemplateTab === id ? 'bg-white text-navy-900 font-bold shadow-sm' : 'font-semibold text-slate-500 hover:text-slate-800'}">${lbl}</button>
                  `).join('')}
                </div>
                <div class="flex-1 min-h-0 flex flex-col rounded-2xl border border-slate-200/90 bg-slate-50/70 overflow-hidden">
                  <div class="px-3.5 py-2.5 bg-white border-b border-slate-100 flex items-center justify-between gap-2 shrink-0">
                    <div class="min-w-0"><h3 class="text-sm font-extrabold text-navy-900 truncate">${tplMeta[0]}</h3><p class="text-[11px] text-slate-500 truncate">${tplMeta[1]}</p></div>
                    <button type="button" onclick="resetTemplateField('${settingsTemplateTab}')" class="px-3 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-semibold text-slate-700 shrink-0 transition">Reset</button>
                  </div>
                  <div class="p-3 flex-1 min-h-0 flex flex-col">
                    <textarea aria-label="${tplMeta[0]} template" oninput="updateTemplateField('${settingsTemplateTab}', this.value)" class="flex-1 min-h-0 w-full p-3 rounded-xl border border-slate-200 bg-white text-base sm:text-xs font-mono text-slate-800 leading-relaxed resize-none">${escapeHtml(team.templates[settingsTemplateTab] || '')}</textarea>
                  </div>
                  <div class="px-3.5 py-2.5 bg-white border-t border-slate-100 shrink-0 space-y-1">
                    <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Available Tags</div>
                    <div class="flex flex-wrap gap-1">${['[<First Name/>]', '[Team]', '[Opponent]', '[Date]', '[Location]', '[Home/Away]', '[Check-In]', '[Lineup]', '[Subs]'].map(tag => `<span class="px-1.5 py-0.5 rounded-md bg-slate-100 border border-slate-200/70 text-[10px] font-mono font-semibold text-slate-600">${escapeHtml(tag)}</span>`).join('')}</div>
                  </div>
                </div>
              </div>
            ` : ''}

            ${settingsTab === 'teams' ? `
              <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain space-y-4 pr-0.5">
                <div class="space-y-1.5">
                  <label for="active-team-name-input" class="block text-sm font-extrabold text-navy-900">Active Team Name</label>
                  <input id="active-team-name-input" type="text" value="${escapeHtml(team.name)}" oninput="renameActiveTeam(this.value, this)" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white text-base sm:text-xs font-bold text-slate-900" />
                </div>
                <div class="space-y-2">
                  <h3 class="text-sm font-extrabold text-navy-900">Teams (${appState.teams.length})</h3>
                  <div class="rounded-2xl border border-slate-200/80 divide-y divide-slate-100 overflow-hidden">
                    ${appState.teams.map(t => `
                      <div class="px-3.5 py-2.5 flex items-center justify-between gap-2 bg-white">
                        <span class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(t.name)}</span>
                        <div class="flex items-center gap-1.5 shrink-0">
                          ${t.id !== team.id ? `<button type="button" onclick="selectTeam('${t.id}')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-semibold text-slate-700">Switch</button>` : '<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-bold">Active</span>'}
                          ${appState.teams.length > 1 ? (pendingDeleteTeamId === t.id
                            ? `<button type="button" onclick="cancelDeleteTeam()" class="px-2.5 py-1 rounded-full bg-slate-100 text-[11px] font-semibold text-slate-700">Cancel</button><button type="button" onclick="confirmDeleteTeam('${t.id}')" class="px-2.5 py-1 rounded-full bg-rose-600 text-white text-[11px] font-bold">Delete</button>`
                            : `<button type="button" aria-label="Remove ${escapeHtml(t.name)}" onclick="promptDeleteTeam('${t.id}')" class="px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-[11px] font-semibold text-rose-600">Remove</button>`
                          ) : ''}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                  <div class="flex items-center gap-2 pt-1">
                    <input id="create-team-input" type="text" aria-label="New team name" placeholder="New Team Name" class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white text-base sm:text-xs placeholder:text-xs font-medium" />
                    <button type="button" onclick="createNewTeam()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-lime-400 text-xs font-extrabold shrink-0">+ Create</button>
                  </div>
                </div>
                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <h3 class="text-sm font-extrabold text-navy-900">App Color Theme</h3>
                  <div class="p-2.5 rounded-xl border border-navy-900 bg-slate-50 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <div class="flex items-center -space-x-1 shrink-0" aria-hidden="true">
                        <span class="w-5 h-5 rounded-full border border-white shadow-sm" style="background:${DEFAULT_THEME.dark900}"></span>
                        <span class="w-5 h-5 rounded-full border border-white shadow-sm" style="background:${DEFAULT_THEME.accent400}"></span>
                      </div>
                      <div class="min-w-0"><div class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(DEFAULT_THEME.name)}</div><div class="text-[10px] text-slate-500 truncate">${escapeHtml(DEFAULT_THEME.subtitle)}</div></div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-navy-900 text-lime-400 text-[10px] font-bold shrink-0">Active</span>
                  </div>
                </div>
              </div>
            ` : ''}

            ${settingsTab === 'sync' ? `
              <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain space-y-4 pr-0.5">
                <div class="space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <label for="sync-passcode-input" class="text-sm font-extrabold text-navy-900">Cloud Sync</label>
                    <span id="settings-sync-pill" role="status" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${cloudStatus === 'synced' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : cloudStatus === 'syncing' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}">
                      <span class="w-1.5 h-1.5 rounded-full ${cloudStatus === 'synced' ? 'bg-emerald-500' : cloudStatus === 'syncing' ? 'bg-amber-500 animate-pulse' : 'bg-slate-400'}" aria-hidden="true"></span>
                      <span>${escapeHtml(cloudStatusDetail)}</span>
                    </span>
                  </div>
                  <div class="flex items-center gap-2">
                    <input id="sync-passcode-input" type="text" value="${escapeHtml(appState.syncCode)}" placeholder="jtt-rushncrush-2026" class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white text-base sm:text-xs placeholder:text-xs font-mono" />
                    <button type="button" onclick="updateSyncRoomCode()" class="px-3.5 py-2 rounded-xl bg-navy-900 text-lime-400 text-xs font-extrabold shrink-0">Connect</button>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="pushToFirestore(true)" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 inline-flex items-center justify-center gap-1.5">${getVectorArrowHtml('up', 'w-3 h-3')}<span>Push Now</span></button>
                    <button type="button" onclick="pullFromFirestore()" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 inline-flex items-center justify-center gap-1.5">${getVectorArrowHtml('down', 'w-3 h-3')}<span>Pull Latest</span></button>
                  </div>
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <div class="flex items-center justify-between"><h3 class="text-sm font-extrabold text-navy-900">Snapshots</h3><button type="button" onclick="createSnapshot()" class="px-3 py-1.5 rounded-full bg-navy-900 text-lime-400 text-xs font-extrabold">Save Snapshot</button></div>
                  ${!allSnapshots.length ? '<p class="text-xs text-slate-400">No saved snapshots yet.</p>' : `
                    <div class="rounded-2xl border border-slate-200/80 divide-y divide-slate-100 overflow-hidden">
                      ${allSnapshots.map(s => `
                        <div class="px-3 py-2 flex items-center justify-between gap-2 bg-white">
                          <span class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(s.label)}</span>
                          <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" onclick="restoreSnapshot('${s.id}')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-[11px] font-semibold text-slate-700">Restore</button>
                            ${pendingDeleteSnapshotId === s.id
                              ? `<button type="button" onclick="cancelDeleteSnapshot()" class="px-2 py-1 rounded-full bg-slate-100 text-[11px] font-semibold text-slate-700">Cancel</button><button type="button" onclick="confirmDeleteSnapshot('${s.id}')" class="px-2 py-1 rounded-full bg-rose-600 text-white text-[11px] font-bold">Delete</button>`
                              : `<button type="button" onclick="promptDeleteSnapshot('${s.id}')" aria-label="Delete snapshot ${escapeHtml(s.label)}" class="w-7 h-7 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold flex items-center justify-center">✕</button>`
                            }
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <h3 class="text-sm font-extrabold text-navy-900">Backup File (.json)</h3>
                  <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="downloadBackupJson()" class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 inline-flex items-center justify-center gap-1.5">${getVectorArrowHtml('down', 'w-3 h-3')}<span>Save Backup File</span></button>
                    <label tabindex="0" role="button" aria-label="Load backup JSON file" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('input').click();}" class="py-2.5 px-3 rounded-xl bg-lime-400 hover:bg-lime-500 text-xs font-extrabold text-center cursor-pointer inline-flex items-center justify-center gap-1.5">
                      ${getVectorArrowHtml('up', 'w-3 h-3')}<span>Load Backup File</span>
                      <input type="file" accept=".json,application/json" onchange="handleJsonBackupUpload(event)" class="hidden" />
                    </label>
                  </div>
                  ${settingsFileError ? `<div role="alert" class="rounded-xl bg-rose-50 border border-rose-200 px-3 py-2 text-xs text-rose-700 flex items-center justify-between gap-2"><span>${escapeHtml(settingsFileError)}</span><button type="button" onclick="dismissSettingsFileError()" aria-label="Dismiss error" class="w-7 h-7 rounded-full bg-rose-100 text-rose-700 font-bold flex items-center justify-center shrink-0">✕</button></div>` : ''}
                </div>
              </div>
            ` : ''}
          </div>
        `
      });
    }

    // =========================================================================
    // 11. MAIN RENDER LOOP, FOCUS TRAP & BOOTSTRAP
    // =========================================================================
    function forceRender() {
      const root = document.getElementById('app');
      if (!root) return;
      const team = getActiveTeam();
      const stepBody = isSkeletonLoading ? renderSkeletonCards()
        : currentStep === 0 ? renderHomeDashboard(team)
        : currentStep === 1 ? renderStep1CheckIn(team)
        : currentStep === 2 ? renderStep2Lineup(team)
        : renderStep3ExportAndHistory(team);

      root.innerHTML = `
        ${renderHeader(team)}
        <main aria-label="Main content" class="flex-1 w-full max-w-lg mx-auto px-3.5 pt-[112px] pb-10">${stepBody}</main>
        ${renderSlotPickerSheetModal(team)}
        ${renderScorecardCourtDrawer(team)}
        ${renderPastMatchModal(team)}
        ${renderSettingsModal(team)}
      `;
      document.body.style.overflow = (isSettingsOpen || pickerModalContext || scorecardDrawerCourtId || isPastMatchModalOpen) ? 'hidden' : '';
    }

    function bootApp() {
      try {
        isDarkMode = localStorage.getItem(DARK_MODE_STORAGE_KEY) === 'true';
        localStorage.setItem(THEME_STORAGE_KEY, DEFAULT_THEME.id);
      } catch (e) {}
      applyTheme(false);
      loadLocalSnapshots();
      try { appState = normalizeFullState(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null')); } catch (e) { appState = normalizeFullState(null); }
      currentStep = 0;
      isMatchDetailsOpen = isTextPreviewOpen = false;
      forceRender();
      dismissBrandedSplash(550);
      initFirebase();
    }

    document.addEventListener('keydown', (e) => {
      const dialogs = document.querySelectorAll('[data-modal-dialog="true"]');
      const activeDialog = dialogs[dialogs.length - 1];
      if (e.key === 'Tab' && activeDialog) {
        const focusable = Array.from(activeDialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
        if (focusable.length) {
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (e.shiftKey && (document.activeElement === first || !activeDialog.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && (document.activeElement === last || !activeDialog.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
        }
        return;
      }
      if (e.key !== 'Escape') return;
      if (scorecardDrawerCourtId) closeScorecardCourtDrawer();
      else if (pickerModalContext) closeSlotPicker();
      else if (isPastMatchModalOpen) closePastMatchModal();
      else if (isSettingsOpen) closeSettings();
      else if (isMatchCalendarOpen) { isMatchCalendarOpen = false; forceRender(); }
      else if (isTeamDropdownOpen) { isTeamDropdownOpen = false; forceRender(); }
      else if (openCourtMenuId) { openCourtMenuId = null; forceRender(); }
    });

    document.addEventListener('click', (e) => {
      if (isMatchCalendarOpen && !e.target?.closest?.('#match-date-field-btn') && !e.target?.closest?.('#match-date-calendar-popover')) {
        isMatchCalendarOpen = false;
        forceRender();
      }
    });

    document.addEventListener('focusin', (e) => { if (e.target?.closest?.('main')) e.target.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' }); });

    Object.assign(window, {
      setStep, toggleDarkMode, toggleMatchDetails, toggleTextPreview, bufferMatchInfo, commitMatchFieldBlur, updateMatchInfo,
      toggleMatchDateCalendar, stepCalendarMonth, pickCalendarDay,
      setCheckInTextMode: (m) => { checkInTextMode = m === 'followup' ? 'followup' : 'availability'; forceRender(); },
      setRosterFilter: (f) => { rosterFilter = ['all', 'in', 'out'].includes(f) ? f : 'all'; forceRender(); },
      setPlayerAvailability, markAllAvailability,
      copyCheckInText: () => copyTextToClipboard(buildActiveCheckInMessage(getActiveTeam()), checkInTextMode === 'followup' ? 'Follow-Up Text copied!' : 'Availability Text copied!'),
      dismissBackupBanner: () => { backupImportBanner = null; forceRender(); },
      toggleTeamDropdown: () => { isTeamDropdownOpen = !isTeamDropdownOpen; forceRender(); },
      closeTeamDropdown: () => { isTeamDropdownOpen = false; forceRender(); },
      selectTeam, openSlotPicker, closeSlotPicker, assignPlayerToSlot, smartAutoFillLineup, handleSwapTap,
      toggleCourtMenu: (id) => { openCourtMenuId = openCourtMenuId === id ? null : id; forceRender(); },
      closeCourtMenu: () => { openCourtMenuId = null; forceRender(); },
      addCourt, removeCourt, moveCourtWithinWave, swapCourtPartners, toggleCourtTimeSlot,
      setExportSubTab: (tab) => { exportSubTab = tab; forceRender(); },
      setExportMessageMode: (mode) => { exportMessageMode = mode === 'coach' ? 'coach' : 'lineup'; forceRender(); },
      openCoachMessageView: () => { exportSubTab = 'messages'; exportMessageMode = 'coach'; forceRender(); },
      copyLineupText: () => copyTextToClipboard(buildLineupTextMessage(getActiveTeam()), 'Lineup Text copied!'),
      copyCoachText: () => copyTextToClipboard(buildCoachTextMessage(getActiveTeam()), 'Coach Text copied!'),
      downloadLineupCardPng,
      toggleQuickScoreMode: () => { isQuickScoreMode = !isQuickScoreMode; forceRender(); },
      handleQuickScoreInput, openScorecardCourtDrawer, closeScorecardCourtDrawer, toggleDrawerTiebreak, updateCourtOpponentSlot, updateCourtScoreField, resetScorecardScores,
      openLogTeamPicker: () => { isLogTeamPickerOpen = true; isNextWeekConfirmOpen = false; getSelectedLogTeamIds(); forceRender(); },
      cancelLogTeamPicker: () => { isLogTeamPickerOpen = false; forceRender(); },
      logCurrentMatchToHistory,
      toggleTeamToLog: (id) => { if (!sessionLoggedTeamIds.has(id)) toggleTeamInSet(getSelectedLogTeamIds(), id); },
      selectAllTeamsToLog: () => { selectedLogTeamIds = new Set(appState.teams.filter(t => !sessionLoggedTeamIds.has(t.id)).map(t => t.id)); forceRender(); },
      dismissMatchLogBanner: () => { matchLogCompletionBanner = null; forceRender(); },
      promptNextWeekConfirm: () => { isNextWeekConfirmOpen = true; isLogTeamPickerOpen = false; getSelectedResetTeamIds(); forceRender(); },
      cancelNextWeekConfirm: () => { isNextWeekConfirmOpen = false; forceRender(); },
      toggleTeamToReset: (id) => toggleTeamInSet(getSelectedResetTeamIds(), id),
      selectAllTeamsToReset: () => { selectedResetTeamIds = new Set(appState.teams.map(t => t.id)); forceRender(); },
      startNextWeek, openPastMatchModal, closePastMatchModal,
      updatePastMatchDraftField: (field, val) => { if (pastMatchDraft) pastMatchDraft[field] = val; },
      formatPastMatchDateField: (el) => { if (pastMatchDraft && el) el.value = pastMatchDraft.date = autoFormatDateInput(el.value); },
      setPastMatchHomeAway: (val) => { if (pastMatchDraft) { pastMatchDraft.homeAway = val === 'Away' ? 'Away' : 'Home'; forceRender(); } },
      togglePastMatchPlayerFormat, savePastMatchModal,
      promptDeleteLoggedMatch: (id) => { pendingDeleteMatchId = id; forceRender(); },
      cancelDeleteLoggedMatch: () => { pendingDeleteMatchId = null; forceRender(); },
      confirmDeleteLoggedMatch, openSettings, closeSettings,
      setSettingsTab: (tab) => { settingsTab = tab; pendingDeletePlayerId = pendingDeleteTeamId = pendingDeleteSnapshotId = null; if (tab === 'sync') refreshCloudSnapshots(); forceRender(); },
      setSettingsTemplateTab: (sub) => { settingsTemplateTab = sub; forceRender(); },
      addRosterPlayer, handleCsvRosterUpload,
      promptDeleteRosterPlayer: (id) => { pendingDeletePlayerId = id; forceRender(); },
      cancelDeleteRosterPlayer: () => { pendingDeletePlayerId = null; forceRender(); },
      confirmDeleteRosterPlayer,
      updateTemplateField: (key, val) => { getActiveTeam().templates[key] = val; saveState(); },
      resetTemplateField, renameActiveTeam, createNewTeam,
      promptDeleteTeam: (id) => { pendingDeleteTeamId = id; forceRender(); },
      cancelDeleteTeam: () => { pendingDeleteTeamId = null; forceRender(); },
      confirmDeleteTeam, updateSyncRoomCode, pushToFirestore, pullFromFirestore, createSnapshot, restoreSnapshot,
      promptDeleteSnapshot: (id) => { pendingDeleteSnapshotId = id; forceRender(); },
      cancelDeleteSnapshot: () => { pendingDeleteSnapshotId = null; forceRender(); },
      confirmDeleteSnapshot, downloadBackupJson, handleJsonBackupUpload,
      dismissSettingsFileError: () => { settingsFileError = null; forceRender(); }
    });

    bootApp();
  </script>
</body>
</html>
