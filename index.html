<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="meta-theme-color" content="#0B1C2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JTT Lineup Builder" />
  <title>JTT Lineup Builder</title>

  <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B1C2E'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23D2FF28'/%3E%3Cpath d='M20 18c6 6 6 22 0 28M44 18c-6 6-6 22 0 28' stroke='%230B1C2E' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            navy: { 800: 'var(--theme-dark-800, #132C47)', 900: 'var(--theme-dark-900, #0B1C2E)' },
            lime: { 400: 'var(--theme-accent-400, #D2FF28)', 500: 'var(--theme-accent-500, #BCEB15)' }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --theme-dark-900: #0B1C2E;
      --theme-dark-800: #132C47;
      --theme-accent-400: #D2FF28;
      --theme-accent-500: #BCEB15;
      --theme-accent-text: #0B1C2E;
      --theme-dark-btn-text: #D2FF28;
      --theme-page-bg: #F4F6F9;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--theme-page-bg);
      color: #0F172A;
      overflow-x: hidden;
    }

    .bg-lime-400 { background-color: var(--theme-accent-400) !important; color: var(--theme-accent-text) !important; }
    .hover\:bg-lime-500:hover { background-color: var(--theme-accent-500) !important; color: var(--theme-accent-text) !important; }
    .bg-lime-400.text-navy-900, .hover\:bg-lime-500:hover.text-navy-900, html.dark-theme .bg-lime-400, html.dark-theme .bg-lime-400.text-navy-900 { color: var(--theme-accent-text) !important; }
    .bg-navy-900 { background-color: var(--theme-dark-900) !important; }
    .bg-navy-800 { background-color: var(--theme-dark-800) !important; }
    .text-navy-900 { color: var(--theme-dark-900) !important; }
    .border-navy-900 { border-color: var(--theme-dark-900) !important; }
    .bg-navy-900.text-lime-400, .bg-navy-900 .text-lime-400, .bg-navy-800 .text-lime-400 { color: var(--theme-dark-btn-text) !important; }
    .bg-emerald-600 { background-color: #059669 !important; color: #FFFFFF !important; }
    .bg-rose-600 { background-color: #E11D48 !important; color: #FFFFFF !important; }

    /* Dark Mode Overrides */
    html.dark-theme, html.dark-theme body { background-color: #090D16 !important; color: #F8FAFC !important; }
    html.dark-theme .bg-white { background-color: #111827 !important; color: #F8FAFC !important; }
    html.dark-theme :is(.bg-slate-50, .bg-slate-50\/70, .bg-slate-50\/80, .bg-slate-50\/90, .bg-slate-50\/40, .bg-slate-100, .bg-slate-100\/90) {
      background-color: #182235 !important;
      color: #F1F5F9 !important;
    }
    html.dark-theme :is(.border-slate-100, .border-slate-200, .border-slate-200\/80, .border-slate-200\/90, .border-slate-300) {
      border-color: #2B3B54 !important;
    }
    html.dark-theme :is(.text-slate-900, .text-slate-800) { color: #F8FAFC !important; }
    html.dark-theme :is(.text-slate-700, .text-slate-600) { color: #CBD5E1 !important; }
    html.dark-theme :is(.text-slate-500, .text-slate-400) { color: #94A3B8 !important; }
    html.dark-theme .text-navy-900 { color: #D2FF28 !important; }
    html.dark-theme .border-navy-900 { border-color: #D2FF28 !important; }
    html.dark-theme :is(input, textarea, select) {
      background-color: #0F172A !important;
      color: #F8FAFC !important;
      border-color: #33445E !important;
    }
    html.dark-theme .bg-emerald-50\/90 { background-color: rgba(6, 78, 59, 0.35) !important; }

    /* WCAG 2.2 Focus Visibility */
    :is(button, a, select, input, textarea, label):focus-visible {
      outline: 2px solid #0284C7;
      outline-offset: 2px;
    }
    header :is(button, a):focus-visible { outline: 2px solid #D2FF28; outline-offset: 2px; }
    main :is(button, input, select, textarea) { scroll-margin-top: 118px; scroll-margin-bottom: 24px; }

    #splash-screen { transition: opacity 0.25s ease, visibility 0.25s ease; }
    #splash-screen.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-lime-400 selection:text-navy-900">

  <div id="splash-screen" class="fixed inset-0 z-[120] bg-navy-900 flex flex-col items-center justify-center px-6 text-center" aria-hidden="true">
    <div class="w-16 h-16 rounded-2xl bg-lime-400 flex items-center justify-center shadow-lg mb-4">
      <svg class="w-9 h-9" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="4" />
        <path d="M18 16c8 8 8 24 0 32M46 16c-8 8-8 24 0 32" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
    </div>
    <h1 class="text-xl font-extrabold text-white tracking-tight">Lineup Builder</h1>
    <p id="splash-subtitle" class="text-xs font-medium text-slate-300 mt-1.5">Loading team &amp; sync...</p>
  </div>

  <div id="app" class="min-h-screen flex flex-col"></div>

  <div id="toast" role="status" aria-live="polite" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[110] pointer-events-none opacity-0 translate-y-2 transition-all duration-200 max-w-[92vw]">
    <div class="px-4 py-2.5 rounded-full bg-navy-900 text-white text-xs font-bold shadow-xl border border-white/15 flex items-center gap-2 whitespace-nowrap">
      <span class="w-2 h-2 rounded-full bg-lime-400 shrink-0" aria-hidden="true"></span>
      <span id="toast-text">Saved</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // =========================================================================
    // 1. CONSTANTS & TEMPLATES
    // =========================================================================
    const STORAGE_KEY = 'jtt_lineup_builder_v1';
    const SNAPSHOTS_STORAGE_KEY = 'jtt_lineup_snapshots_v1';
    const THEME_STORAGE_KEY = 'jtt_lineup_theme_v1';
    const DARK_MODE_STORAGE_KEY = 'jtt_lineup_dark_mode_v1';
    const DEFAULT_SYNC_CODE = 'jtt-rushncrush-2026';
    const DEFAULT_APP_ID = 'jtt-lineup-builder';

    const DEFAULT_THEME = {
      id: 'classic',
      name: 'Modern Club (Default)',
      subtitle: 'Clubhouse Navy & Optic Lime',
      dark900: '#0B1C2E',
      dark800: '#132C47',
      accent400: '#D2FF28',
      accent500: '#BCEB15',
      accentText: '#0B1C2E',
      darkBtnText: '#D2FF28',
      pageBg: '#F4F6F9'
    };

    const REQUIRED_AVAILABILITY_TEMPLATE = [
      'JTT Availability for [<First Name/>]:',
      'Match: [Team] vs [Opponent]',
      'Date: [Date]',
      'Location: [Location] ([Home/Away])',
      'Check-In: [Check-In]',
      '',
      'Is [<First Name/>] available? Reply IN or OUT.'
    ].join('\n');

    const REQUIRED_FOLLOWUP_TEMPLATE = [
      'Reminder — JTT Availability for [<First Name/>]',
      "Haven't heard back yet—is [<First Name/>] available to play? Please reply IN or OUT."
    ].join('\n');

    const DEFAULT_LINEUP_TEMPLATE = [
      '[Team] vs [Opponent]',
      'Date: [Date]',
      'Location: [Location] ([Home/Away])',
      'Check-In: [Check-In]',
      '',
      '[Lineup]',
      '',
      'Matchplay / Subs:',
      '[Subs]'
    ].join('\n');

    // =========================================================================
    // 2. APPLICATION STATE
    // =========================================================================
    let appState = null, isDarkMode = false, currentStep = 0;
    let isMatchDetailsOpen = false, isMatchCalendarOpen = false, isTextPreviewOpen = false;
    let calendarViewYear = null, calendarViewMonth = null;
    let checkInTextMode = 'availability', rosterFilter = 'all', exportSubTab = 'messages', exportMessageMode = 'lineup';
    let isQuickScoreMode = false, isTeamDropdownOpen = false, openCourtMenuId = null, swapSource = null;
    let pickerModalContext = null, scorecardDrawerCourtId = null, scorecardDrawerShowTb = false;
    let isSettingsOpen = false, settingsTab = 'roster', settingsTemplateTab = 'availability';
    let isPastMatchModalOpen = false, editingPastMatchId = null, pastMatchDraft = null;
    let isLogTeamPickerOpen = false, isNextWeekConfirmOpen = false;
    let selectedLogTeamIds = null, selectedResetTeamIds = null, sessionLoggedTeamIds = new Set();
    let matchLogCompletionBanner = null, backupImportBanner = null, settingsFileError = null;
    let pendingDeleteMatchId = null, pendingDeletePlayerId = null, pendingDeleteTeamId = null, pendingDeleteSnapshotId = null;
    let isSkeletonLoading = false, lastFocusedElement = null;

    let db = null, firestoreAppId = DEFAULT_APP_ID, cloudUnsubscribe = null;
    let cloudStatus = 'offline', cloudStatusDetail = 'Local device storage active';
    let localSnapshots = [], cloudSnapshots = [], isRemoteApplying = false, remotePushTimer = null;

    // =========================================================================
    // 3. UTILITIES & VECTOR ICONS
    // =========================================================================
    const generateId = (prefix = 'id') => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    const ARROW_PATHS = {
      right: '<path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />',
      down: '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3" />',
      up: '<path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />'
    };

    const getVectorArrowHtml = (dir = 'right', cls = '') =>
      `<svg class="w-3.5 h-3.5 inline-block shrink-0 ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">${ARROW_PATHS[dir] || ARROW_PATHS.right}</svg>`;

    const getVectorChevronHtml = (cls = '') =>
      `<svg class="w-3.5 h-3.5 pointer-events-none shrink-0 ${cls}" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>`;

    function showToast(message) {
      const toast = document.getElementById('toast'), text = document.getElementById('toast-text');
      if (!toast || !text) return;
      text.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__jttToastTimer);
      window.__jttToastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
      }, 2400);
    }

    function copyTextToClipboard(text, successMsg = 'Copied!') {
      try {
        const ta = Object.assign(document.createElement('textarea'), { value: text });
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(successMsg); return true; }
      } catch (e) {}
      navigator.clipboard?.writeText(text).then(() => showToast(successMsg)).catch(() => showToast('Unable to copy automatically'));
      return false;
    }

    const formatDisplayTime = (val) => String(val || '').trim() || 'TBD';
    const formatScorecardTime = (val) => String(val || '').trim() || '—';

    function autoFormatTimeInput(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      let hour = NaN, mins = '00', explicitMeridiem = '', core = val;
      const merMatch = val.match(/\s*([ap]m)$/i);
      if (merMatch) { explicitMeridiem = merMatch[1].toUpperCase(); core = val.slice(0, merMatch.index).trim(); }
      const colonMatch = core.match(/^(\d{1,2}):(\d{2})$/), compactMatch = core.match(/^(\d{1,4})$/);
      if (colonMatch) { hour = parseInt(colonMatch[1], 10); mins = colonMatch[2]; }
      else if (compactMatch) {
        const d = compactMatch[1];
        if (d.length <= 2) hour = parseInt(d, 10);
        else if (d.length === 3) { hour = parseInt(d.slice(0, 1), 10); mins = d.slice(1); }
        else { hour = parseInt(d.slice(0, 2), 10); mins = d.slice(2); }
      } else return val;

      if (isNaN(hour) || hour < 0 || hour > 23 || Number(mins) > 59) return val;
      let meridiem = explicitMeridiem;
      if (!meridiem) {
        if (hour === 0) { hour = 12; meridiem = 'AM'; }
        else if (hour === 12) meridiem = 'PM';
        else if (hour > 12) { hour -= 12; meridiem = 'PM'; }
        else meridiem = (hour >= 8 && hour <= 11) ? 'AM' : 'PM';
      } else if (hour === 0) hour = 12;
      else if (hour > 12) hour -= 12;
      return `${hour}:${mins} ${meridiem}`;
    }

    function autoFormatDateInput(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      const currentYear = new Date().getFullYear();
      const iso = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      let parsed = null;
      if (iso) parsed = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]), 12, 0, 0);
      else if (/^\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?$/.test(val)) {
        const [m, d, y] = val.split(/[\/\-]/);
        parsed = new Date(y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : currentYear, Number(m) - 1, Number(d), 12, 0, 0);
      } else if (/^[A-Za-z]{3,9}\s+\d{1,2}$/.test(val)) parsed = new Date(`${val}, ${currentYear} 12:00:00`);
      return (parsed && !isNaN(parsed.getTime())) ? parsed.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : val;
    }

    function advanceDateBySevenDays(dateStr) {
      const clean = String(dateStr || '').trim();
      if (!clean) return '';
      const attempt = new Date(`${clean}, ${new Date().getFullYear()} 12:00:00`);
      if (isNaN(attempt.getTime())) return clean;
      attempt.setDate(attempt.getDate() + 7);
      return attempt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function applyTheme(persist = true) {
      const root = document.documentElement;
      [['--theme-dark-900', DEFAULT_THEME.dark900], ['--theme-dark-800', DEFAULT_THEME.dark800], ['--theme-accent-400', DEFAULT_THEME.accent400], ['--theme-accent-500', DEFAULT_THEME.accent500], ['--theme-accent-text', DEFAULT_THEME.accentText], ['--theme-dark-btn-text', DEFAULT_THEME.darkBtnText], ['--theme-page-bg', DEFAULT_THEME.pageBg]]
        .forEach(([k, v]) => root.style.setProperty(k, v));
      root.classList.toggle('dark-theme', Boolean(isDarkMode));
      if (persist) {
        try { localStorage.setItem(THEME_STORAGE_KEY, DEFAULT_THEME.id); localStorage.setItem(DARK_MODE_STORAGE_KEY, String(isDarkMode)); } catch (e) {}
      }
    }

    function toggleDarkMode() { isDarkMode = !isDarkMode; applyTheme(true); forceRender(); }

    function dismissBrandedSplash(delayMs = 350) {
      clearTimeout(window.__jttSplashTimer);
      window.__jttSplashTimer = setTimeout(() => document.getElementById('splash-screen')?.classList.add('splash-hidden'), delayMs);
    }

    function triggerBrandedSplash(subtitleText = 'Loading team & sync...', durationMs = 750) {
      const splash = document.getElementById('splash-screen'), sub = document.getElementById('splash-subtitle');
      if (sub) sub.textContent = subtitleText;
      if (splash) { splash.classList.remove('splash-hidden'); dismissBrandedSplash(durationMs); }
    }

    // =========================================================================
    // 4. DATA NORMALIZATION (100% BACKWARD-COMPATIBLE WITH BACKUP JSON)
    // =========================================================================
    const createDefaultCourts = () => [
      { id: 'c_d1', type: 'Doubles', number: 1, timeSlot: '1st Hr', slots: ['', ''], oppNames: ['', ''], ourScore: '', oppScore: '', ourTb: '', oppTb: '' },
      { id: 'c_d2', type: 'Doubles', number: 2, timeSlot: '1st Hr', slots: ['', ''], oppNames: ['', ''], ourScore: '', oppScore: '', ourTb: '', oppTb: '' },
      { id: 'c_s1', type: 'Singles', number: 1, timeSlot: '2nd Hr', slots: [''], oppNames: [''], ourScore: '', oppScore: '', ourTb: '', oppTb: '' },
      { id: 'c_s2', type: 'Singles', number: 2, timeSlot: '2nd Hr', slots: [''], oppNames: [''], ourScore: '', oppScore: '', ourTb: '', oppTb: '' }
    ];

    const createDefaultTeam = (name = 'My JTT Team') => ({
      id: generateId('team'),
      name,
      players: [],
      matchInfo: { date: '', opponent: '', homeAway: 'Home', location: '', checkInTime: '', doublesTime: '', singlesTime: '' },
      courts: createDefaultCourts(),
      history: [],
      templates: { availability: REQUIRED_AVAILABILITY_TEMPLATE, followup: REQUIRED_FOLLOWUP_TEMPLATE, lineup: DEFAULT_LINEUP_TEMPLATE }
    });

    function renumberCourts(courts) {
      const counters = { Doubles: 0, Singles: 0, Mixed: 0 };
      return courts.map(c => {
        const type = c.type === 'Singles' ? 'Singles' : c.type === 'Mixed' ? 'Mixed' : 'Doubles';
        counters[type] += 1;
        const n = type === 'Singles' ? 1 : 2;
        return {
          ...c, type, number: counters[type], timeSlot: c.timeSlot === '2nd Hr' ? '2nd Hr' : '1st Hr',
          slots: Array.from({ length: n }, (_, i) => c.slots?.[i] || ''),
          oppNames: Array.from({ length: n }, (_, i) => c.oppNames?.[i] || ''),
          ourScore: c.ourScore ?? '', oppScore: c.oppScore ?? '', ourTb: c.ourTb ?? '', oppTb: c.oppTb ?? ''
        };
      });
    }

    const normalizeMessageLayout = (tpl) => String(tpl || '')
      .replace(/^Location:\s*\[Location\]\s*$/gm, 'Location: [Location] ([Home/Away])')
      .replace(/^([^[(\n]+)\s*\(\[Home\/Away\]\)\s*$/gm, '$1')
      .replace(/Matchplay\s*\/\s*Subs:\s*\[Subs\]/gi, 'Matchplay / Subs:\n[Subs]');

    function normalizeTeam(rawTeam, fallbackIndex = 0) {
      const base = createDefaultTeam(rawTeam?.name?.trim() || (fallbackIndex === 0 ? 'My JTT Team' : `JTT Team ${fallbackIndex + 1}`));
      if (!rawTeam || typeof rawTeam !== 'object') return base;
      base.id = rawTeam.id || base.id;

      const idLookup = new Map(), nameLookup = new Map();
      base.players = (Array.isArray(rawTeam.players) ? rawTeam.players : []).map((p, idx) => {
        const origId = String(p.id || p.playerId || p._id || `p_${idx}_${generateId('pl')}`);
        const cleanName = String(p.name || p.fullName || `Player ${idx + 1}`).trim();
        const gender = String(p.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M';
        const available = Boolean(p.available ?? p.isIn ?? (String(p.status || '').toUpperCase() === 'IN'));
        idLookup.set(origId, origId);
        nameLookup.set(cleanName.toLowerCase(), origId);
        return { id: origId, name: cleanName, gender, available };
      });

      const resolvePlayerRef = (ref) => {
        if (!ref) return '';
        if (typeof ref === 'object') {
          const objId = ref.id || ref.playerId || ref._id;
          if (objId && idLookup.has(String(objId))) return idLookup.get(String(objId));
          return ref.name ? (nameLookup.get(String(ref.name).trim().toLowerCase()) || '') : '';
        }
        const str = String(ref).trim();
        return idLookup.get(str) || nameLookup.get(str.toLowerCase()) || '';
      };

      const m = rawTeam.matchInfo || rawTeam.match || {};
      base.matchInfo = {
        date: String(m.date || m.matchDate || '').trim(),
        opponent: String(m.opponent || m.opponentName || '').trim(),
        homeAway: m.homeAway === 'Away' ? 'Away' : 'Home',
        location: String(m.location || m.site || '').trim(),
        checkInTime: String(m.checkInTime || m.checkIn || '').trim(),
        doublesTime: String(m.doublesTime || m.firstHrTime || '').trim(),
        singlesTime: String(m.singlesTime || m.secondHrTime || '').trim()
      };

      const tpl = rawTeam.templates || {};
      base.templates = {
        availability: normalizeMessageLayout(tpl.availability || m.availabilityTemplate || REQUIRED_AVAILABILITY_TEMPLATE),
        followup: String(tpl.followup || REQUIRED_FOLLOWUP_TEMPLATE),
        lineup: normalizeMessageLayout(tpl.lineup || m.lineupTemplate || DEFAULT_LINEUP_TEMPLATE)
      };

      let parsedCourts = [];
      if (Array.isArray(rawTeam.courts) && rawTeam.courts.length > 0) {
        parsedCourts = rawTeam.courts.map((c, idx) => {
          const type = c.type === 'Singles' ? 'Singles' : c.type === 'Mixed' ? 'Mixed' : 'Doubles';
          const n = type === 'Singles' ? 1 : 2;
          const rawSlots = Array.isArray(c.slots) ? c.slots : [c.p1 || c.player1 || '', c.p2 || c.player2 || ''];
          return {
            id: c.id || generateId(`c_${idx}`), type, number: c.number || idx + 1,
            timeSlot: (c.timeSlot === '2nd Hr' || c.timeSlot === '2nd') ? '2nd Hr' : '1st Hr',
            slots: Array.from({ length: n }, (_, i) => resolvePlayerRef(rawSlots[i])),
            oppNames: Array.from({ length: n }, (_, i) => c.oppNames?.[i] ? String(c.oppNames[i]) : ''),
            ourScore: c.ourScore != null ? String(c.ourScore) : '', oppScore: c.oppScore != null ? String(c.oppScore) : '',
            ourTb: c.ourTb != null ? String(c.ourTb) : '', oppTb: c.oppTb != null ? String(c.oppTb) : ''
          };
        });
      } else if (rawTeam.lineup && typeof rawTeam.lineup === 'object') {
        const pushLegacyGroup = (items, type, defaultWave, prefix) => {
          if (!Array.isArray(items)) return;
          const n = type === 'Singles' ? 1 : 2;
          items.forEach((item, idx) => {
            const rawSlots = Array.isArray(item.slots) ? item.slots : [item.p1, item.p2];
            parsedCourts.push({
              id: item.id || generateId(`${prefix}_${idx}`), type, number: idx + 1,
              timeSlot: (item.timeSlot === '2nd' || item.timeSlot === '2nd Hr') ? '2nd Hr' : (item.timeSlot === '1st' || item.timeSlot === '1st Hr') ? '1st Hr' : defaultWave,
              slots: Array.from({ length: n }, (_, i) => resolvePlayerRef(rawSlots[i])),
              oppNames: n === 1 ? [item.opp1 || ''] : [item.opp1 || '', item.opp2 || ''],
              ourScore: item.usGames ?? item.ourScore ?? '', oppScore: item.oppGames ?? item.oppScore ?? '',
              ourTb: item.tbScore ?? item.ourTb ?? '', oppTb: item.oppTb ?? ''
            });
          });
        };
        pushLegacyGroup(rawTeam.lineup.doubles, 'Doubles', '1st Hr', 'cd');
        pushLegacyGroup(rawTeam.lineup.singles, 'Singles', '2nd Hr', 'cs');
        pushLegacyGroup(rawTeam.lineup.mixedDoubles, 'Mixed', '1st Hr', 'cm');
      }

      base.courts = renumberCourts(parsedCourts.length ? parsedCourts : createDefaultCourts());
      const assignedIds = new Set(base.courts.flatMap(c => c.slots).filter(Boolean));
      if (assignedIds.size > 0) base.players = base.players.map(p => assignedIds.has(p.id) ? { ...p, available: true } : p);

      base.history = (Array.isArray(rawTeam.history) ? rawTeam.history : []).map((h, idx) => {
        const entries = (Array.isArray(h.entries) ? h.entries : []).map(e => {
          const pid = resolvePlayerRef(e.playerId || e.id || e.name);
          if (!pid) return null;
          const fmtRaw = String(e.format || 'Doubles').toUpperCase();
          const format = ['S', 'BS', 'GS', 'SINGLES'].includes(fmtRaw) ? 'Singles' : ['XD', 'MIXED'].includes(fmtRaw) ? 'Mixed' : 'Doubles';
          return { playerId: pid, format, court: e.court || '' };
        }).filter(Boolean);

        const availSet = new Set((Array.isArray(h.availablePlayerIds) ? h.availablePlayerIds : []).map(resolvePlayerRef).filter(Boolean));
        entries.forEach(e => availSet.add(e.playerId));
        return {
          id: h.id || generateId(`hist_${idx}`), date: String(h.date || h.matchDate || 'Logged Match').trim(),
          opponent: String(h.opponent || h.opponentName || '').trim(), homeAway: h.homeAway === 'Away' ? 'Away' : 'Home',
          entries, availablePlayerIds: Array.from(availSet)
        };
      });

      return base;
    }

    function normalizeFullState(raw) {
      const source = (raw && typeof raw === 'object') ? (raw.data || raw.state || raw.backup || raw) : null;
      const rawTeams = (source?.teams?.length > 0) ? source.teams : [createDefaultTeam('My JTT Team')];
      const teams = rawTeams.map((t, idx) => normalizeTeam(t, idx));
      const activeTeamId = teams.some(t => t.id === source?.activeTeamId) ? source.activeTeamId : teams[0].id;
      const syncCode = String(source?.syncCode || source?.syncRoomCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
      return { teams, activeTeamId, syncCode, updatedAt: source?.updatedAt || Date.now() };
    }

    function getActiveTeam() {
      if (!appState?.teams?.length) appState = normalizeFullState(null);
      let team = appState.teams.find(t => t.id === appState.activeTeamId);
      if (!team) { team = appState.teams[0]; appState.activeTeamId = team.id; }
      return team;
    }

    const getPlayerNameById = (team, pid) => pid ? (team.players.find(pl => pl.id === pid)?.name || '') : '';

    // =========================================================================
    // 5. STATS, CONFLICTS & SCORECARD HELPERS
    // =========================================================================
    function computePlayerStats(team) {
      const stats = Object.fromEntries(team.players.map(p => [p.id, { weeks: 0, played: 0, doubles: 0, singles: 0, mixed: 0, out: 0 }]));
      team.history.forEach(match => {
        const played = new Set();
        (match.entries || []).forEach(e => {
          const st = stats[e.playerId];
          if (!st) return;
          st.played += 1;
          played.add(e.playerId);
          st[e.format === 'Singles' ? 'singles' : e.format === 'Mixed' ? 'mixed' : 'doubles'] += 1;
        });
        played.forEach(pid => { if (stats[pid]) stats[pid].weeks += 1; });
        new Set(match.availablePlayerIds || []).forEach(pid => { if (stats[pid] && !played.has(pid)) stats[pid].out += 1; });
      });
      return stats;
    }

    function findSameHourConflicts(team) {
      const seen = { '1st Hr': new Set(), '2nd Hr': new Set() }, conflicts = new Set();
      team.courts.forEach(c => {
        const wave = c.timeSlot === '2nd Hr' ? '2nd Hr' : '1st Hr';
        c.slots.forEach(pid => { if (pid) (seen[wave].has(pid) ? conflicts : seen[wave]).add(pid); });
      });
      return conflicts;
    }

    function findDoubleHeaderPlayers(team) {
      const first = new Set(), second = new Set();
      team.courts.forEach(c => c.slots.forEach(pid => { if (pid) (c.timeSlot === '2nd Hr' ? second : first).add(pid); }));
      return new Set([...first].filter(pid => second.has(pid)));
    }

    function getCourtExportNames(team, court) {
      const isDoubles = court.slots.length > 1;
      return {
        isDoubles,
        ourList: court.slots.map(pid => getPlayerNameById(team, pid) || '—'),
        oppList: (isDoubles ? [court.oppNames?.[0], court.oppNames?.[1]] : [court.oppNames?.[0]]).map(n => String(n || '').trim()).filter(Boolean)
      };
    }

    function getCourtOutcome(c) {
      const sOur = String(c.ourScore ?? '').trim(), sOpp = String(c.oppScore ?? '').trim();
      if (!sOur || !sOpp || isNaN(Number(sOur)) || isNaN(Number(sOpp))) return { ourWon: false, oppWon: false };
      if (Number(sOur) !== Number(sOpp)) return { ourWon: Number(sOur) > Number(sOpp), oppWon: Number(sOpp) > Number(sOur) };
      const tOur = String(c.ourTb ?? '').trim(), tOpp = String(c.oppTb ?? '').trim();
      if (tOur && tOpp && !isNaN(Number(tOur)) && !isNaN(Number(tOpp)) && Number(tOur) !== Number(tOpp)) {
        return { ourWon: Number(tOur) > Number(tOpp), oppWon: Number(tOpp) > Number(tOur) };
      }
      return { ourWon: false, oppWon: false };
    }

    const formatCourtScoreLabel = (score, tb) => {
      const s = String(score ?? '').trim(), t = String(tb ?? '').trim();
      return !s ? '—' : (t ? `${s} (${t})` : s);
    };

    function computeScorecardTotals(team) {
      let ourGames = 0, oppGames = 0, hasAnyScore = false;
      team.courts.forEach(c => {
        const sOur = String(c.ourScore ?? '').trim(), sOpp = String(c.oppScore ?? '').trim();
        if (sOur !== '' && !isNaN(Number(sOur))) { ourGames += Number(sOur); hasAnyScore = true; }
        if (sOpp !== '' && !isNaN(Number(sOpp))) { oppGames += Number(sOpp); hasAnyScore = true; }
      });
      return { ourGames, oppGames, hasAnyScore };
    }

    // =========================================================================
    // 6. PERSISTENCE, SNAPSHOTS & FIREBASE SYNC
    // =========================================================================
    function loadLocalSnapshots() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SNAPSHOTS_STORAGE_KEY) || '[]');
        localSnapshots = Array.isArray(parsed) ? parsed : [];
      } catch (e) { localSnapshots = []; }
    }

    const saveLocalSnapshots = () => { try { localStorage.setItem(SNAPSHOTS_STORAGE_KEY, JSON.stringify(localSnapshots.slice(0, 15))); } catch (e) {} };

    function saveState(skipCloudPush = false) {
      if (!appState) return;
      appState.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
      if (!skipCloudPush && !isRemoteApplying) pushToFirestore();
    }

    function saveStateQuietly(immediateRemote = false) {
      if (!appState) return;
      appState.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
      if (isRemoteApplying) return;
      clearTimeout(remotePushTimer);
      if (immediateRemote) pushToFirestore();
      else remotePushTimer = setTimeout(() => pushToFirestore(), 500);
    }

    const isEditingFormElement = () => ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);

    async function initFirebase() {
      try {
        if (typeof __app_id !== 'undefined' && __app_id) firestoreAppId = String(__app_id);
        if (typeof __firebase_config === 'undefined' || !__firebase_config) throw new Error('No cloud config');
        const cfg = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        const fbApp = initializeApp(cfg, `jtt_${Date.now()}`);
        db = getFirestore(fbApp);
        try { await signInAnonymously(getAuth(fbApp)); } catch (e) {}
        subscribeToSyncRoom();
      } catch (err) {
        cloudStatus = 'offline';
        cloudStatusDetail = 'Local device storage active';
        dismissBrandedSplash(350);
        forceRender();
      }
    }

    function subscribeToSyncRoom() {
      if (!db || !appState) return;
      cloudUnsubscribe?.();
      const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
      const roomRef = doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code);

      cloudStatus = 'syncing';
      cloudStatusDetail = `Connecting to room "${code}"...`;
      let isFirstSnapshot = true;

      cloudUnsubscribe = onSnapshot(roomRef, (snap) => {
        if (snap.exists() && snap.data()?.payload) {
          const remote = snap.data();
          if (Number(remote.updatedAt || 0) > Number(appState.updatedAt || 0) + 500) {
            isRemoteApplying = true;
            appState = normalizeFullState(remote.payload);
            appState.syncCode = code;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
            isRemoteApplying = false;

            if (!isFirstSnapshot) {
              isSkeletonLoading = true;
              forceRender();
              setTimeout(() => { isSkeletonLoading = false; forceRender(); }, 320);
            }
          }
        }
        isFirstSnapshot = false;
        cloudStatus = 'synced';
        cloudStatusDetail = `Synced with "${code}"`;
        dismissBrandedSplash(280);
        if (!isEditingFormElement()) forceRender();
      }, (err) => {
        isFirstSnapshot = false;
        cloudStatus = 'offline';
        cloudStatusDetail = `Local mode (${err?.code || 'offline'})`;
        dismissBrandedSplash(280);
        if (!isEditingFormElement()) forceRender();
      });

      refreshCloudSnapshots();
    }

    async function pushToFirestore(manual = false) {
      if (!db || !appState) { if (manual) showToast('Saved locally on this device'); return; }
      const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
      cloudStatus = 'syncing';
      if (manual) forceRender();
      try {
        await setDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code), { payload: appState, updatedAt: appState.updatedAt || Date.now() });
        cloudStatus = 'synced';
        cloudStatusDetail = `Synced with "${code}"`;
        if (manual) showToast('Pushed to Cloud Sync!');
      } catch (err) {
        cloudStatus = 'offline';
        cloudStatusDetail = `Saved locally (${err?.code || 'offline'})`;
        if (manual) showToast('Saved locally (cloud offline)');
      }
      if (!isEditingFormElement()) forceRender();
    }

    async function pullFromFirestore() {
      if (!db || !appState) return showToast('Cloud sync unavailable offline');
      const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
      isSkeletonLoading = true;
      forceRender();
      try {
        const snap = await getDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code));
        if (snap.exists() && snap.data()?.payload) {
          isRemoteApplying = true;
          appState = normalizeFullState(snap.data().payload);
          appState.syncCode = code;
          saveState(true);
          isRemoteApplying = false;
          cloudStatus = 'synced';
          cloudStatusDetail = `Pulled latest from "${code}"`;
          showToast('Latest lineup pulled!');
        } else showToast('No remote data in room yet');
      } catch (e) { showToast('Could not pull from cloud'); }
      finally { isSkeletonLoading = false; forceRender(); }
    }

    async function refreshCloudSnapshots() {
      if (!db || !appState) return;
      const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
      try {
        const qs = await getDocs(collection(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code, 'snapshots'));
        const items = [];
        qs.forEach(d => { const data = d.data(); if (data?.payload) items.push({ id: d.id, label: data.label || 'Cloud Snapshot', createdAt: data.createdAt || 0, payload: data.payload }); });
        cloudSnapshots = items.sort((a, b) => b.createdAt - a.createdAt).slice(0, 10);
        if (isSettingsOpen && settingsTab === 'sync') forceRender();
      } catch (e) {}
    }

    async function createSnapshot() {
      const team = getActiveTeam();
      const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const snapObj = { id: generateId('snap'), label: `${team.name} • ${stamp}`, createdAt: Date.now(), payload: JSON.parse(JSON.stringify(appState)) };
      localSnapshots = [snapObj, ...localSnapshots].slice(0, 12);
      saveLocalSnapshots();

      if (db && appState) {
        const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
        try {
          await setDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code, 'snapshots', snapObj.id), snapObj);
          await refreshCloudSnapshots();
        } catch (e) {}
      }
      showToast('Snapshot saved!');
      forceRender();
    }

    function restoreSnapshot(snapId) {
      const found = [...cloudSnapshots, ...localSnapshots].find(s => s.id === snapId);
      if (!found?.payload) return;
      appState = normalizeFullState(found.payload);
      saveState();
      pendingDeleteSnapshotId = null;
      isSettingsOpen = false;
      triggerBrandedSplash('Restoring snapshot...', 650);
      showToast('Snapshot restored!');
      forceRender();
    }

    async function confirmDeleteSnapshot(snapId) {
      localSnapshots = localSnapshots.filter(s => s.id !== snapId);
      saveLocalSnapshots();
      cloudSnapshots = cloudSnapshots.filter(s => s.id !== snapId);
      pendingDeleteSnapshotId = null;
      if (db && appState) {
        const code = (appState.syncCode || DEFAULT_SYNC_CODE).trim() || DEFAULT_SYNC_CODE;
        try { await deleteDoc(doc(db, 'artifacts', firestoreAppId, 'public', 'data', 'jtt_sync_rooms', code, 'snapshots', snapId)); } catch (e) {}
      }
      showToast('Snapshot deleted');
      forceRender();
    }

    function downloadBackupJson() {
      const team = getActiveTeam();
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href: url, download: `JTT_Backup_${new Date().toISOString().slice(0, 10)}.json` });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported ${team.name} backup`);
    }

    function handleJsonBackupUpload(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(String(e.target.result || ''));
          if (!parsed || typeof parsed !== 'object') throw new Error('Invalid JSON');
          appState = normalizeFullState(parsed);
          appState.activeTeamId = appState.teams[0].id;
          sessionLoggedTeamIds.clear();
          selectedLogTeamIds = new Set([appState.teams[0].id]);
          matchLogCompletionBanner = null;
          saveState();
          settingsFileError = null;
          isSettingsOpen = false;
          currentStep = 0;
          const totalPlayers = appState.teams.reduce((sum, t) => sum + t.players.length, 0);
          backupImportBanner = `Loaded ${appState.teams.length} team(s) • ${totalPlayers} total players`;
          triggerBrandedSplash('Importing backup...', 700);
          showToast('Backup imported!');
          forceRender();
        } catch (err) {
          settingsFileError = 'Invalid backup file. Please select a valid JTT .json backup.';
          showToast('Backup file error');
          forceRender();
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // =========================================================================
    // 7. MESSAGE BUILDERS & 2X RETINA PNG SCORECARD GENERATOR
    // =========================================================================
    function applyTemplateTags(rawTemplate, team, extras = {}) {
      const m = team.matchInfo;
      const map = {
        '[Team]': team.name || 'My JTT Team',
        '[Opponent]': m.opponent.trim() || 'Opponent',
        '[Date]': m.date.trim() || 'TBD',
        '[Home/Away]': m.homeAway || 'Home',
        '[Location]': m.location.trim() || 'TBD',
        '[Check-In]': formatDisplayTime(m.checkInTime),
        '[Doubles]': formatDisplayTime(m.doublesTime),
        '[Singles]': formatDisplayTime(m.singlesTime),
        '[Lineup]': extras.lineup || '',
        '[Subs]': extras.subs || ''
      };
      return Object.entries(map).reduce((acc, [tag, val]) => acc.split(tag).join(val), String(rawTemplate || ''));
    }

    const buildActiveCheckInMessage = (team) => applyTemplateTags(
      checkInTextMode === 'followup' ? (team.templates.followup || REQUIRED_FOLLOWUP_TEMPLATE) : (team.templates.availability || REQUIRED_AVAILABILITY_TEMPLATE),
      team
    );

    function buildFormattedLineupBlock(team) {
      return [
        { label: 'Doubles', time: formatDisplayTime(team.matchInfo.doublesTime), courts: team.courts.filter(c => c.type !== 'Singles') },
        { label: 'Singles', time: formatDisplayTime(team.matchInfo.singlesTime), courts: team.courts.filter(c => c.type === 'Singles') }
      ].filter(g => g.courts.length > 0).flatMap(g => [
        `${g.time} - ${g.label}:`,
        ...g.courts.map(c => `• ${c.type === 'Mixed' ? `Mixed #${c.number}` : `#${c.number}`}: ${c.slots.map(pid => getPlayerNameById(team, pid) || 'TBD').join(' / ')}`),
        ''
      ]).join('\n').trim();
    }

    function getUnassignedAvailablePlayers(team) {
      const assigned = new Set(team.courts.flatMap(c => c.slots).filter(Boolean));
      return team.players.filter(p => p.available && !assigned.has(p.id));
    }

    function buildLineupTextMessage(team) {
      const subs = getUnassignedAvailablePlayers(team);
      return applyTemplateTags(normalizeMessageLayout(team.templates.lineup || DEFAULT_LINEUP_TEMPLATE), team, {
        lineup: buildFormattedLineupBlock(team),
        subs: subs.length > 0 ? subs.map(p => `• ${p.name}`).join('\n') : '• None'
      });
    }

    function buildCoachTextMessage(team) {
      const m = team.matchInfo;
      return [
        `JTT Lineup — ${team.name || 'My JTT Team'} vs ${m.opponent.trim() || 'Opponent'}`,
        `Date: ${m.date.trim() || 'TBD'}`,
        `Location: ${m.location.trim() || 'TBD'} (${m.homeAway || 'Home'})`,
        '',
        buildFormattedLineupBlock(team)
      ].join('\n').trim();
    }

    function downloadLineupCardPng() {
      const team = getActiveTeam();
      if ((team.matchInfo.homeAway || 'Home') === 'Away') return showToast('Scorecard is only generated for Home matches');

      const sections = [
        { title: `${formatScorecardTime(team.matchInfo.doublesTime)} - Doubles`, courts: team.courts.filter(c => c.type !== 'Singles') },
        { title: `${formatScorecardTime(team.matchInfo.singlesTime)} - Singles`, courts: team.courts.filter(c => c.type === 'Singles') }
      ].filter(s => s.courts.length > 0);

      const subs = getUnassignedAvailablePlayers(team);
      const { ourGames, oppGames, hasAnyScore } = computeScorecardTotals(team);
      const ourScorecardName = team.name || 'My JTT Team', oppScorecardName = team.matchInfo.opponent.trim() || 'Opponent';

      const W = 1600, headerH = 260, scheduleH = 92;
      const bodyH = 40 + sections.reduce((sum, sec) => sum + 56 + sec.courts.reduce((a, c) => a + (c.slots.length > 1 ? 156 : 114), 0) + 24, 0);
      const totalsH = hasAnyScore ? 138 : 0;
      const H = headerH + scheduleH + bodyH + totalsH + 128;

      const canvas = Object.assign(document.createElement('canvas'), { width: W, height: H });
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = DEFAULT_THEME.dark900;
      ctx.fillRect(0, 0, W, headerH);

      ctx.fillStyle = DEFAULT_THEME.darkBtnText;
      ctx.font = '700 22px Inter, sans-serif';
      ctx.fillText('JUNIOR TEAM TENNIS', 84, 54);

      const drawBannerTeam = (text, x, align, maxW) => {
        ctx.textAlign = align;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 40px Inter, sans-serif';
        if (ctx.measureText(text).width > maxW) ctx.font = '800 32px Inter, sans-serif';
        if (ctx.measureText(text).width <= maxW) return ctx.fillText(text, x, 134);
        let l1 = '', l2 = '';
        text.split(/\s+/).forEach(w => {
          const t = l1 ? `${l1} ${w}` : w;
          if (!l2 && ctx.measureText(t).width <= maxW) l1 = t;
          else l2 = l2 ? `${l2} ${w}` : w;
        });
        ctx.fillText(l1, x, 112);
        if (l2) ctx.fillText(l2, x, 150);
      };

      const sideMaxW = (W - 168 - 116) / 2;
      drawBannerTeam(ourScorecardName, 84, 'left', sideMaxW);

      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.roundRect(W / 2 - 38, 102, 76, 42, 21);
      ctx.fill();
      ctx.fillStyle = DEFAULT_THEME.darkBtnText;
      ctx.font = '800 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('VS', W / 2, 130);

      drawBannerTeam(oppScorecardName, W - 84, 'right', sideMaxW);
      ctx.textAlign = 'left';

      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(84, 178);
      ctx.lineTo(W - 84, 178);
      ctx.stroke();

      ctx.fillStyle = '#E2E8F0';
      ctx.font = '600 26px Inter, sans-serif';
      ctx.fillText(`Location: ${team.matchInfo.location.trim() || '—'}`, 84, 224);

      const gridTop = headerH + 16, gridLeft = 84, gridW = W - 168, rowH = 76;
      ctx.strokeStyle = '#CBD5E1';
      ctx.fillStyle = '#F8FAFC';
      ctx.fillRect(gridLeft, gridTop, gridW, rowH);
      ctx.strokeRect(gridLeft, gridTop, gridW, rowH);
      ctx.beginPath();
      ctx.moveTo(gridLeft + gridW / 2, gridTop);
      ctx.lineTo(gridLeft + gridW / 2, gridTop + rowH);
      ctx.stroke();

      [['MATCH DATE', team.matchInfo.date.trim() || '—'], ['CHECK-IN', formatScorecardTime(team.matchInfo.checkInTime)]].forEach(([lbl, val], col) => {

    function smartAutoFillLineup() {
      const team = getActiveTeam(), inPlayers = team.players.filter(p => p.available);
      if (!inPlayers.length) return showToast('Mark players IN on Check-In first');

      const stats = computePlayerStats(team), recentPairs = new Set();
      if (team.history[0]?.entries) {
        const byCourt = {};
        team.history[0].entries.forEach(e => { if (e.format === 'Doubles' || e.format === 'Mixed') (byCourt[e.court || 'd'] ||= []).push(e.playerId); });
        Object.values(byCourt).forEach(pair => { if (pair.length === 2) recentPairs.add([...pair].sort().join('|')); });
      }

      const assignedToday = new Set();
      ['1st Hr', '2nd Hr'].forEach(wave => {
        const usedInWave = new Set();
        team.courts.filter(c => c.timeSlot === wave).forEach(court => {
          court.slots = court.slots.map(() => '');
          for (let sIdx = 0; sIdx < court.slots.length; sIdx++) {
            const candidates = inPlayers.filter(p => !usedInWave.has(p.id)).sort((a, b) => {
              const diffUsed = (assignedToday.has(a.id) ? 1 : 0) - (assignedToday.has(b.id) ? 1 : 0);
              if (diffUsed) return diffUsed;
              const sa = stats[a.id] || { weeks: 0, played: 0, singles: 0, doubles: 0 }, sb = stats[b.id] || { weeks: 0, played: 0, singles: 0, doubles: 0 };
              return (sa.weeks - sb.weeks) || (sa.played - sb.played) || (court.type === 'Singles' ? sa.singles - sb.singles : sa.doubles - sb.doubles) || a.name.localeCompare(b.name);
            });
            if (!candidates.length) continue;
            let chosen = candidates[0];
            if (court.slots.length === 2 && sIdx === 1 && court.slots[0]) {
              const fresh = candidates.find(c => !recentPairs.has([court.slots[0], c.id].sort().join('|')));
              if (fresh) chosen = fresh;
            }
            court.slots[sIdx] = chosen.id;
            usedInWave.add(chosen.id);
            assignedToday.add(chosen.id);
          }
        });
      });

      saveState();
      showToast('Smart Auto-Fill complete!');
      forceRender();
    }

    function logCurrentMatchToHistory() {
      const unlogged = appState.teams.filter(t => !sessionLoggedTeamIds.has(t.id));
      const targetIds = unlogged.length ? getSelectedLogTeamIds() : new Set([getActiveTeam().id]);
      if (!targetIds.size) return showToast('Select at least 1 team to log');

      const loggedNames = [];
      let skippedEmpty = 0;
      appState.teams.forEach(t => {
        if (!targetIds.has(t.id)) return;
        const entries = t.courts.flatMap(c => c.slots.filter(Boolean).map(playerId => ({ playerId, format: c.type, court: c.type === 'Mixed' ? `Mixed #${c.number}` : `${c.type} #${c.number}` })));
        if (!entries.length) { skippedEmpty += 1; return; }
        const availSet = new Set(t.players.filter(p => p.available).map(p => p.id));

        t.history.unshift({
          id: generateId('match'), date: t.matchInfo.date.trim() || new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),

    const openPastMatchModal = (matchId = null) => openModal(() => {

      const playerFormats = Object.fromEntries(team.players.map(p => [p.id, []]));
      const existing = matchId ? team.history.find(h => h.id === matchId) : null;
      if (existing) {
        (existing.entries || []).forEach(e => {
          (playerFormats[e.playerId] ||= []);
          if (!playerFormats[e.playerId].includes(e.format)) playerFormats[e.playerId].push(e.format);
        });
      }
      pastMatchDraft = { date: existing?.date || '', opponent: existing?.opponent || '', homeAway: existing?.homeAway || 'Home', playerFormats };

      if (!pastMatchDraft) return;
      const curr = pastMatchDraft.playerFormats[playerId] || [];
      pastMatchDraft.playerFormats[playerId] = format === 'Out' ? [] : curr.includes(format) ? curr.filter(f => f !== format) : [...curr, format];
      forceRender();

      if (!pastMatchDraft) return;
      const team = getActiveTeam(), entries = [], availablePlayerIds = [];
      Object.entries(pastMatchDraft.playerFormats).forEach(([pid, fmts]) => {
        if (fmts?.length) { availablePlayerIds.push(pid); fmts.forEach(fmt => entries.push({ playerId: pid, format: fmt, court: fmt })); }
      });
      const record = {
        id: editingPastMatchId || generateId('match'), date: autoFormatDateInput(pastMatchDraft.date) || 'Logged Match',
        opponent: String(pastMatchDraft.opponent || '').trim() || 'Opponent', homeAway: pastMatchDraft.homeAway === 'Away' ? 'Away' : 'Home',
        entries, availablePlayerIds
      };
      if (editingPastMatchId) { const idx = team.history.findIndex(h => h.id === editingPastMatchId); if (idx !== -1) team.history[idx] = record; }
      else team.history.unshift(record);
      saveState();
      closePastMatchModal();
      showToast('Match saved to History!');

      const nameInput = document.getElementById('new-player-name'), genderSelect = document.getElementById('new-player-gender');

      getActiveTeam().players.push({ id: generateId('pl'), name, gender: genderSelect?.value === 'F' ? 'F' : 'M', available: false });
      nameInput.value = '';
      saveState();
      showToast(`Added ${name}`);
      forceRender();
    }

    function handleCsvRosterUpload(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const lines = String(e.target.result || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (!lines.length) return showToast('CSV file is empty');
          const team = getActiveTeam();
          let added = 0;
          lines.forEach((line, idx) => {
            const [rawName = '', rawGender = ''] = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
            if (idx === 0 && /^(name|player|player\s*name)$/i.test(rawName) && (!rawGender || /^(gender|sex|m\/f)$/i.test(rawGender))) return;
            if (!rawName) return;
            team.players.push({ id: generateId('pl'), name: rawName, gender: rawGender.toUpperCase().startsWith('F') ? 'F' : 'M', available: false });
            added += 1;
          });
          if (!added) return showToast('No valid players found in CSV');
          saveState();
          showToast(`Imported ${added} player(s) from CSV`);
          forceRender();
        } catch (err) { showToast('Unable to read CSV file'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

      const team = getActiveTeam();
      team.players = team.players.filter(p => p.id !== playerId);
      team.courts.forEach(c => { c.slots = c.slots.map(pid => pid === playerId ? '' : pid); });
      pendingDeletePlayerId = null;

    function selectTeam(teamId, targetStep = null) {
      if (!appState.teams.some(t => t.id === teamId)) return;
      appState.activeTeamId = teamId;
      if (!sessionLoggedTeamIds.has(teamId)) selectedLogTeamIds = new Set([teamId]);
      if (targetStep !== null) currentStep = targetStep;

    function renameActiveTeam(newName, inputEl = null) {
      const clean = String(newName || '').trim(), team = getActiveTeam();
      if (!clean) { if (inputEl) inputEl.value = team.name; return; }
      if (team.name === clean) return;
      team.name = clean;
      saveStateQuietly(false);

      const input = document.getElementById('create-team-input'), name = input?.value.trim();
      if (!name) return showToast('Enter a team name');
      const newTeam = createDefaultTeam(name);
      appState.teams.push(newTeam);

      appState.teams = appState.teams.filter(t => t.id !== teamId);

    function renderCourtCard(team, court, waveCourts, doubleHeaders) {

    function renderSlotPickerSheetModal(team) {
      if (!pickerModalContext) return '';
      const court = team.courts.find(c => c.id === pickerModalContext.courtId);
      if (!court) return '';
      const currentSlotPid = court.slots[pickerModalContext.slotIndex] || '', stats = computePlayerStats(team);
      const usedSame = new Set(), usedOther = new Set();
      team.courts.forEach(c => c.slots.forEach((pid, sIdx) => {
        if (pid && !(c.id === court.id && sIdx === pickerModalContext.slotIndex)) (c.timeSlot === court.timeSlot ? usedSame : usedOther).add(pid);
      }));
      const inPlayers = team.players.filter(p => p.available).sort((a, b) => {
        const sa = stats[a.id] || { out: 0, played: 0 }, sb = stats[b.id] || { out: 0, played: 0 };
        return (sb.out - sa.out) || (sa.played - sb.played) || a.name.localeCompare(b.name);
      });
      const openInHour = inPlayers.filter(p => !usedSame.has(p.id)), alreadyInHour = inPlayers.filter(p => usedSame.has(p.id));
      const otherWave = court.timeSlot === '1st Hr' ? '2nd Hr' : '1st Hr';

      return renderModalShell({
        titleId: 'picker-modal-title',
        title: `Select Player • ${court.type} #${court.number} (${court.timeSlot})`,
        subtitle: 'Sorted by most Out &amp; fewest Played',
        closeFn: 'closeSlotPicker()',
        closeLabel: 'Close player picker',
        bodyHtml: `
          <div class="p-3 overflow-y-auto overscroll-contain space-y-3 flex-1">
            ${currentSlotPid ? `<button type="button" onclick="assignPlayerToSlot('')" class="w-full py-2.5 px-3.5 rounded-xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100 text-xs font-bold text-rose-700 text-left">Clear Current Slot (${escapeHtml(getPlayerNameById(team, currentSlotPid))})</button>` : ''}
            ${!inPlayers.length ? '<div class="p-6 text-center text-xs text-slate-500">No players are marked IN yet. Mark players IN on Check-In first.</div>' : `
              <div class="space-y-1.5">
                <div class="px-1 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Available for ${court.timeSlot}</div>
                ${openInHour.map(p => {
                  const st = stats[p.id] || { played: 0, out: 0 };
                  return `<button type="button" onclick="assignPlayerToSlot('${p.id}')" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-left flex items-center justify-between gap-2 transition"><div class="min-w-0"><div class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(p.name)}</div><div class="text-[11px] font-medium text-slate-500 mt-0.5">${p.gender} • Played ${st.played} • Out ${st.out}</div></div>${usedOther.has(p.id) ? `<span class="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-bold shrink-0">✓ ${otherWave}</span>` : ''}</button>`;
                }).join('')}
              </div>
              ${alreadyInHour.length ? `
                <div class="space-y-1.5 pt-1">
                  <div class="px-1 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Already in ${court.timeSlot}</div>
                  ${alreadyInHour.map(p => {
                    const st = stats[p.id] || { played: 0, out: 0 };
                    return `<button type="button" onclick="assignPlayerToSlot('${p.id}')" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/70 hover:bg-slate-100 text-left flex items-center justify-between gap-2 opacity-80"><div class="min-w-0"><div class="text-sm font-extrabold text-slate-700 truncate">${escapeHtml(p.name)}</div><div class="text-[11px] font-medium text-slate-500 mt-0.5">${p.gender} • Played ${st.played} • Out ${st.out}</div></div><span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-bold shrink-0">In ${court.timeSlot}</span></button>`;
                  }).join('')}
                </div>
              ` : ''}
            `}
          </div>
        `
      });
    }
